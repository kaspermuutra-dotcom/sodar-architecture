<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>SODAR — panorama tour</title>
<link rel="stylesheet" href="vendor/psv-core.min.css" />
<link rel="stylesheet" href="vendor/psv-virtual-tour.min.css" />
<link rel="stylesheet" href="vendor/psv-markers.min.css" />
<style>
  html, body, #viewer { margin: 0; width: 100%; height: 100%; background: #000; }
  #hud {
    position: fixed; left: 8px; top: 8px; z-index: 20;
    font: 13px/1.4 system-ui, sans-serif; color: #fff;
    background: rgba(0, 0, 0, .55); padding: 6px 9px; border-radius: 6px;
    pointer-events: none;
  }
  #fail {
    position: fixed; inset: 0; display: none; place-items: center;
    font: 15px/1.5 system-ui, sans-serif; color: #fff; background: #111;
    padding: 24px; text-align: center;
  }
</style>
</head>
<body>
<div id="hud">SODAR tour — drag to look, pinch to zoom, tap a marker to move</div>
<div id="viewer"></div>
<div id="fail">This tour could not be loaded. Try reloading the page.</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "@photo-sphere-viewer/core": "./vendor/psv-core.module.js",
    "@photo-sphere-viewer/virtual-tour-plugin": "./vendor/psv-virtual-tour.module.js",
    "@photo-sphere-viewer/markers-plugin": "./vendor/psv-markers.module.js",
    "@photo-sphere-viewer/gyroscope-plugin": "./vendor/psv-gyroscope.module.js"
  }
}
</script>

<script type="module">
import { Viewer } from '@photo-sphere-viewer/core';
import { VirtualTourPlugin } from '@photo-sphere-viewer/virtual-tour-plugin';
import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';
import { GyroscopePlugin } from '@photo-sphere-viewer/gyroscope-plugin';

const params = new URLSearchParams(location.search);
const tourUrl = params.get('tour') || 'tour.json';
const hud = document.getElementById('hud');
const t0 = performance.now();

async function main() {
  let tour;
  try {
    tour = await fetch(tourUrl).then((r) => {
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return r.json();
    });
  } catch (err) {
    document.getElementById('fail').style.display = 'grid';
    hud.remove();
    console.error('SODAR tour: failed to load', tourUrl, err);
    return;
  }

  const startNodeId = params.get('node') || tour.startNodeId;

  const viewer = new Viewer({
    container: 'viewer',
    defaultYaw: 0,
    navbar: ['zoom', 'move', 'gyroscope', 'caption', 'fullscreen'],
    plugins: [
      MarkersPlugin,
      [VirtualTourPlugin, { positionMode: 'manual', renderMode: 'markers' }],
      [GyroscopePlugin, { touchmoveTwoFingers: true }],
    ],
  });

  const vt = viewer.getPlugin(VirtualTourPlugin);
  vt.setNodes(tour.nodes, startNodeId);

  viewer.addEventListener(
    'ready',
    () => {
      const ms = Math.round(performance.now() - t0);
      hud.textContent = `SODAR tour — first panorama ready in ${ms} ms`;
    },
    { once: true },
  );

  window.sodarViewer = viewer;
}

main();
</script>
</body>
</html>

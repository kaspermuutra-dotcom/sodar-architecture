<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Sodar movement point: a substantial white ring with a dark halo so it reads on pale and dark floors. The plane is
       padded (r 80) beyond the drawn ring (r 58) so the tap area is larger than the visible mark. -->
  <circle cx="80" cy="80" r="66" fill="rgba(0,0,0,0.20)"/>
  <circle cx="80" cy="80" r="58" fill="rgba(255,255,255,0.14)" stroke="rgba(0,0,0,0.42)" stroke-width="16"/>
  <circle cx="80" cy="80" r="58" fill="none" stroke="#ffffff" stroke-width="10"/>
  <circle cx="80" cy="80" r="22" fill="rgba(255,255,255,0.96)" stroke="rgba(0,0,0,0.28)" stroke-width="3"/>
</svg>
